# =============================================================================
# Engine WhatsApp Beregam - WAHA (WhatsApp HTTP API)
#
# Dijalankan di PC kantor, di dalam WSL2. Tidak pernah di Hostinger.
#
# Sebelum menjalankan:
#   1. Salin .env.example menjadi .env, lalu isi semuanya
#   2. docker compose up -d
#
# CATATAN PEMILIHAN ENGINE
# Rancangan awal (docs/plan.docx) memilih OpenWA. Saat hendak dipasang,
# ternyata image openwa/wa-automate terakhir diperbarui Februari 2025 dan
# HANYA punya tag `latest` - tidak ada versi untuk dikunci, sehingga aturan
# "jangan pernah pakai latest" mustahil dipenuhi. WAHA aktif dirawat,
# punya tag bertanggal, dan panduan implementasi di docs/ memang ditulis
# untuk WAHA sehingga seluruh detail konfigurasinya sudah terdokumentasi.
# =============================================================================

services:
  waha:
    # Tag versi WAJIB spesifik, JANGAN PERNAH `latest`.
    #
    # Dengan `latest`, satu `docker compose pull` di hari yang salah bisa
    # mematikan layanan WhatsApp BPS tanpa ada yang mengubah kode apa pun.
    # Upgrade dilakukan sadar: baca changelog -> uji di staging -> produksi.
    image: ${WAHA_IMAGE}
    container_name: beregam-waha
    restart: unless-stopped

    ports:
      # WAJIB terikat ke 127.0.0.1, JANGAN 0.0.0.0.
      #
      # Tanpa awalan 127.0.0.1, port ini terbuka ke seluruh jaringan kantor,
      # dan siapa pun yang terhubung ke jaringan yang sama bisa mengirim
      # WhatsApp atas nama BPS Kabupaten Musi Rawas.
      #
      # Port host 3001, bukan 3000: pada komputer pengembangan, port 3000
      # sudah dipakai server Next.js PESTA. Di dalam container tetap 3000
      # sesuai bawaan WAHA.
      - "127.0.0.1:${WAHA_PORT:-3001}:3000"

    environment:
      # --- Engine ---
      # NOWEB memakai baileys, TANPA Chromium. Bawaan WAHA adalah WEBJS yang
      # menjalankan Chromium - sekitar 300-500 MB RAM untuk pekerjaan yang
      # sama, dan RAM itu nanti dibutuhkan AI worker pada Fase 2.
      WHATSAPP_DEFAULT_ENGINE: NOWEB

      # Simpan riwayat pesan di engine agar pesan yang tertahan saat PC mati
      # ikut tersinkron setelah pulih.
      WHATSAPP_NOWEB_STORE_ENABLED: "True"
      WHATSAPP_NOWEB_STORE_FULLSYNC: "True"

      # Sesi otomatis dijalankan ulang setelah container restart, sehingga
      # tidak perlu ada manusia yang menyalakannya setiap kali PC boot.
      WHATSAPP_RESTART_ALL_SESSIONS: "True"

      TZ: Asia/Jakarta

      # --- Keamanan API lokal ---
      WHATSAPP_API_KEY: ${WAHA_API_KEY}

      # --- Webhook ke PESTA ---
      # Semua koneksi berasal DARI PC KE internet. PC tidak pernah menerima
      # koneksi masuk, jadi tidak butuh IP publik, port forwarding, atau tunnel.
      WHATSAPP_HOOK_URL: ${PESTA_BASE_URL}/api/beregam/webhook
      WHATSAPP_HOOK_HMAC_KEY: ${BEREGAM_WEBHOOK_HMAC}
      WHATSAPP_HOOK_EVENTS: ${WAHA_HOOK_EVENTS:-message,session.status}

      # Kredensial dashboard dan Swagger.
      #
      # Diisi eksplisit, bukan dibiarkan dibangkitkan otomatis: WAHA
      # membuat sandi acak baru setiap container restart dan mencetaknya ke
      # log. Sandi yang berganti sendiri tidak bisa dicatat di runbook, dan
      # sandi yang tercetak di log bukan tempat yang pantas untuk kredensial.
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USER:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD}
      WHATSAPP_SWAGGER_USERNAME: ${WAHA_DASHBOARD_USER:-admin}
      WHATSAPP_SWAGGER_PASSWORD: ${WAHA_DASHBOARD_PASSWORD}

    volumes:
      # Kredensial sesi WhatsApp.
      #
      # Folder ini SENGAJA TIDAK PERNAH DI-BACKUP. Isinya setara kunci untuk
      # menyamar sebagai WhatsApp resmi BPS. Menyalinnya ke drive cadangan
      # atau cloud menciptakan liabilitas keamanan yang jauh lebih besar
      # daripada nilai dua menit yang dihemat.
      #
      # Pemulihan bukan restore, melainkan: pasang lalu tautkan ulang lewat
      # pairing code dari HP. Sekitar dua menit.
      - ./data/waha:/app/.sessions

    # Batasi memori supaya engine tidak menggerus jatah AI worker nanti.
    # WSL2 dibatasi 8 GB lewat .wslconfig; alokasi kasarnya:
    #   engine ~400 MB + worker pesan ~120 MB + AI worker ~1,5 GB
    deploy:
      resources:
        limits:
          memory: 1g

    healthcheck:
      # Kunci API WAJIB disertakan. Dengan WHATSAPP_API_KEY aktif, SELURUH
      # endpoint WAHA termasuk /health menolak permintaan tanpa kunci -
      # healthcheck tanpa kunci akan selamanya melaporkan unhealthy padahal
      # engine-nya baik-baik saja.
      test:
        - CMD-SHELL
        - wget -q --spider --header="X-Api-Key: ${WAHA_API_KEY}" http://localhost:3000/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

    logging:
      # Tanpa batas ini, log setahun bisa memenuhi disk PC diam-diam.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
